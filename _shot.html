<!doctype html><html><body style="margin:0;background:#888"><iframe id="f" style="border:0;display:block"></iframe><script>
const p=new URLSearchParams(location.search),w=+p.get('w')||1440,h=+p.get('h')||1000,s=p.get('s'),theme=p.get('t');
const f=document.getElementById('f');f.width=w;f.height=h;f.src='new/index.html';

</script></body></html>
