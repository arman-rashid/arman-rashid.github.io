name: Update CV from Website

on:
  schedule:
    - cron: '0 0 * * 1'   # every Monday at 00:00 UTC
  workflow_dispatch:      # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch Google Scholar stats
        run: python fetch_scholar.py
        continue-on-error: true  # keep last known-good scholar_stats.json if Scholar blocks/rate-limits us

      - name: Generate CV
        run: python generate_cv.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.html scholar_stats.json
          git diff --staged --quiet || git commit -m "chore: update CV and scholar stats from website data"
          git push
