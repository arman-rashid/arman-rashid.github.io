<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2eee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)">
<title>Site Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2eee6; --bg-2: #ebe6dc; --card: #faf7f1; --ink: #15130f; --ink-2: #3d3830; --muted: #776f63;
  --line: rgba(21,19,15,.13); --line-strong: rgba(21,19,15,.28);
  --accent: #cf4c14; --accent-ink: #fff; --ok: #2f7d5b; --warn: #b7791f; --bad: #b42318;
  --glow: rgba(207,76,20,.14);
  --head: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --code: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --nav-h: 64px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0b0a; --bg-2: #13110e; --card: #171410; --ink: #efe8dc; --ink-2: #cfc6b7; --muted: #8f8677;
    --line: rgba(239,232,220,.11); --line-strong: rgba(239,232,220,.26);
    --accent: #ff7a3d; --accent-ink: #120a05; --ok: #5fd6a0; --warn: #f0b44c; --bad: #ff6b5e; --glow: rgba(255,122,61,.16);
  }
}
:root[data-theme="dark"] {
  --bg: #0c0b0a; --bg-2: #13110e; --card: #171410; --ink: #efe8dc; --ink-2: #cfc6b7; --muted: #8f8677;
  --line: rgba(239,232,220,.11); --line-strong: rgba(239,232,220,.26);
  --accent: #ff7a3d; --accent-ink: #120a05; --ok: #5fd6a0; --warn: #f0b44c; --bad: #ff6b5e; --glow: rgba(255,122,61,.16);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

/* ── header ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 18px; }
.sig { font-family: 'Mrs Saint Delafield', cursive; font-size: 34px; line-height: 1; padding-top: 6px; }
.top-t { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.top-t b { font-family: var(--head); font-weight: 600; font-size: 15px; }
.top-t small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
.spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 19px; height: 19px; }

/* ── views ── */
main { max-width: 760px; margin: 0 auto; padding: 18px 18px calc(var(--nav-h) + 110px); }
.view-h { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 16px; }
.view-h h1 { font-family: var(--head); font-weight: 600; font-size: 28px; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
.view-h p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.sub-h { font-family: var(--head); font-weight: 600; font-size: 17px; margin: 28px 0 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn svg { width: 17px; height: 17px; }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }

/* list rows */
.list { border: 1px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; }
.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.noimg { grid-template-columns: 1fr auto; }
.row.new { box-shadow: inset 3px 0 0 var(--accent); }
.thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--bg-2) center/cover no-repeat; border: 1px solid var(--line); }
.thumb.contain { background-size: contain; background-color: #fff; }
.row-b { min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; }
.row-k { font-size: 12px; color: var(--accent); font-weight: 600; }
.row-t { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-d { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv { display: flex; flex-direction: column; gap: 2px; }
.mv button { width: 32px; height: 26px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.mv button:disabled { opacity: .25; }
.mv svg { width: 16px; height: 16px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }

/* files */
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--card); padding: 0 14px; margin-bottom: 12px; }
.frow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.frow:last-child { border-bottom: 0; }
.frow code { font-family: var(--code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.frow small { color: var(--muted); font-size: 12px; }
.frow .tag { font-size: 11px; font-weight: 600; color: var(--accent); }

/* deploy */
.run { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.run:last-child { border-bottom: 0; }
.run .st { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.st.success { background: var(--ok); } .st.failure, .st.cancelled { background: var(--bad); } .st.in_progress, .st.queued, .st.pending, .st.waiting { background: var(--warn); animation: pulse 1s infinite; }
.run b { font-weight: 600; font-size: 14px; display: block; }
.run small { color: var(--muted); font-size: 12px; }
.actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
.act b { display: block; font-family: var(--head); font-weight: 600; font-size: 15px; }
.act span { font-size: 12.5px; color: var(--muted); }

/* ── bottom nav + publish bar ── */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding-bottom: env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.pub-bar { max-width: 760px; margin: 0 auto; padding: 10px 14px 0; }
.pub-pill { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 8px 8px 16px; border-radius: 16px; border: 1px solid var(--accent); background: var(--card); box-shadow: 0 0 0 4px var(--glow); }
.pub-pill .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; flex: none; }
.pub-pill .txt { flex: 1; min-width: 0; text-align: left; }
.pub-pill .txt b { display: block; font-size: 14px; }
.pub-pill .txt small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabs { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { color: var(--accent); }

/* ── sheet ── */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--bg); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line-strong); transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 760px; margin: 0 auto; }
.sheet.open { transform: none; }
.sheet.full { height: calc(100% - 20px - env(safe-area-inset-top, 0px)); }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-family: var(--head); font-weight: 600; font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-b { overflow: auto; padding: 16px; -webkit-overflow-scrolling: touch; flex: 1; }
.sheet-f { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
.sheet-f .btn { flex: 1; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } .pulse, .dot.busy, .st { animation: none !important; } }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
.field > em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 5px; }
.inp { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--card); padding: 10px 12px; }
textarea.inp { min-height: 84px; resize: vertical; line-height: 1.45; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card); font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.inline { display: flex; gap: 8px; }
.inline .inp { flex: 1; }

.imgpick { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: center; }
.imgpick .thumb { width: 88px; height: 88px; }
.imgpick .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.imgpick small { display: block; color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 6px; font-family: var(--code); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
.gallery button { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2) center/cover no-repeat; position: relative; overflow: hidden; }
.gallery button span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 3px 4px; background: rgba(0,0,0,.55); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }

.editor-wrap { display: flex; flex-direction: column; height: 100%; }
.editor { flex: 1; width: 100%; min-height: 50vh; border: 0; border-radius: 0; background: var(--card); padding: 14px; font: 12.5px/1.55 var(--code); white-space: pre; overflow: auto; resize: none; tab-size: 2; }
.findbar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.findbar .inp { min-height: 36px; height: 36px; padding: 6px 10px; }
.findbar small { color: var(--muted); font-size: 12px; min-width: 44px; text-align: right; }

.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 0; align-items: start; }
.steps .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.steps li.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.doing .n { border-color: var(--accent); color: var(--accent); animation: pulse 1s infinite; }
.steps li.fail .n { background: var(--bad); border-color: var(--bad); color: #fff; }
.steps b { display: block; font-weight: 600; }
.steps small { color: var(--muted); font-size: 12.5px; }
.chg { list-style: none; margin: 0 0 14px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.chg li { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.chg li:last-child { border-bottom: 0; }
.chg code { font-family: var(--code); font-size: 12px; color: var(--muted); }
.chg .k { font-size: 11px; font-weight: 700; color: var(--accent); width: 46px; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.err { background: var(--bad); color: #fff; }

/* onboarding */
.welcome { padding-top: 6vh; }
.welcome .sig { font-size: 64px; }
.welcome h1 { font-family: var(--head); font-weight: 600; font-size: 30px; letter-spacing: -.02em; margin: 10px 0 8px; line-height: 1.1; }
.welcome p { color: var(--ink-2); max-width: 54ch; }
.welcome ol { padding-left: 20px; color: var(--ink-2); }
.welcome ol li { margin-bottom: 8px; }
.welcome a { color: var(--accent); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
@keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="sig" aria-hidden="true">Arman</span>
    <div class="top-t"><b>Site Studio</b><small id="status"><span class="dot"></span>Not connected</small></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="reloadBtn" aria-label="Reload from GitHub" title="Reload from GitHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main id="main"><div class="loading">Loading…</div></main>

<div class="dock hidden" id="dock">
  <div class="pub-bar hidden" id="pubBar">
    <button class="pub-pill" id="pubPill">
      <span class="pulse"></span>
      <span class="txt"><b id="pubCount">1 unpublished change</b><small id="pubSummary"></small></span>
      <span class="btn primary sm">Review &amp; publish</span>
    </button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg>News</button>
    <button data-tab="papers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Papers</button>
    <button data-tab="honours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="m8.5 13-1.5 8 5-3 5 3-1.5-8"/></svg>Honours</button>
    <button data-tab="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Files</button>
    <button data-tab="deploy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Deploy</button>
  </nav>
</div>

<div class="scrim hidden" id="scrim"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f" id="sheetFoot"></div>
</section>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" class="hidden">

<script src="core.js"></script>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',

  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',

const b64ToText = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), (c) => c.charCodeAt(0)));

const rawUrl = (p) => `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${S.head || cfg.branch}/${p.split('/').map(encodeURIComponent).join('/')}`;

/* ───────── GitHub API ───────── */
async function gh(path, opts = {}) {
  const url = path.startsWith('http') ? path : `https://api.github.com/repos/${cfg.owner}/${cfg.repo}${path}`;
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: Object.assign({
      Authorization: `Bearer ${cfg.token}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    }, opts.body ? { 'Content-Type': 'application/json' } : {}, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store',
  });
  if (res.status === 204) return null;
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) {
    const m = (data && data.message) || res.statusText;
    const hint = res.status === 401 ? 'The token was rejected. Paste a fresh one in Settings.'
      : res.status === 403 ? `GitHub refused (${m}). Check the token has Contents and Actions write access for this repo.`
      : res.status === 404 ? `Not found: ${path.split('?')[0]}. Check owner, repo and branch in Settings, and that the token can see this repo.`
      : res.status === 409 || res.status === 422 ? `GitHub rejected the request: ${m}`
      : `GitHub error ${res.status}: ${m}`;
    const e = new Error(hint); e.status = res.status; throw e;
  }
  return data;
}

async function loadAll() {
  setStatus('busy', 'Loading from GitHub…');
  const ref = await gh(`/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
  S.head = ref.object.sha;
  const [file, commit] = await Promise.all([
    gh(`/contents/index.html?ref=${S.head}`),
    gh(`/git/commits/${S.head}`),
  ]);
  S.indexSha = file.sha;
  S.indexText = file.content ? b64ToText(file.content) : b64ToText((await gh(`/git/blobs/${file.sha}`)).content);
  try { S.model = Core.parseIndex(S.indexText); S.modelOk = true; }
  catch (e) { S.model = null; S.modelOk = false; toast(e.message, true); }
  S.indexDirty = false; S.rawIndex = null; S.changes.clear(); S.log = [];
  const t = await gh(`/git/trees/${commit.tree.sha}?recursive=1`);
  S.tree = t.tree.filter((x) => x.type === 'blob');
  setStatus('ok', `${cfg.branch} @ ${S.head.slice(0, 7)} · ${ago(commit.committer.date)}`);
  updatePubBar();
}

/* ───────── image handling ───────── */
async function resizeImage(file, max = 1600) {
  if (/svg|gif/.test(file.type)) return { blob: file, ext: file.name.split('.').pop().toLowerCase() };
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return { blob: file, ext: (file.name.split('.').pop() || 'jpg').toLowerCase() };
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  const png = file.type === 'image/png';
  if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
  cx.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((r) => cv.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.86));
  return { blob, ext: png ? 'png' : 'jpg' };
}
const blobToB64 = (blob) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
const blobToURL = (blob) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });

function pickFile(accept, capture) {

    i.onchange = () => resolve(i.files[0] || null); i.click();
  });
}
function uniquePath(dir, name) {
  const exists = (p) => S.tree.some((x) => x.path === p) || S.changes.has(p);
  let p = `${dir}/${name}`; const dot = name.lastIndexOf('.'); const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  for (let i = 2; exists(p); i++) p = `${dir}/${base}-${i}${ext}`;
  return p;
}
async function uploadImage(hint) {
  const f = await pickFile('image/*');
  if (!f) return null;
  const { blob, ext } = await resizeImage(f);
  const base = slug(hint || f.name.replace(/\.[^.]+$/, '')) || 'image';
  const path = uniquePath('images', `${base}.${ext}`);
  S.changes.set(path, { kind: 'b64', content: await blobToB64(blob), preview: await blobToURL(blob), size: blob.size });
  note(`Added ${path}`);
  toast(`Added ${path.split('/').pop()} (${fmtSize(blob.size)})`);
  return path;
}
function imageGallery(onPick) {

function openEditor(path, text) {

function reviewPublish() {
  const pend = pendingPaths();
  const body = document.createElement('div');
  body.append(el(`<ul class="chg">${[...pend.entries()].map(([p, c]) => `<li><span class="k">${c.kind === 'delete' ? 'DELETE' : S.tree.some((x) => x.path === p) ? 'EDIT' : 'NEW'}</span><code>${esc(p)}</code></li>`).join('')}</ul>`));
  const auto = S.log.length === 1 ? S.log[0] : `Update site: ${S.log.slice(0, 3).join('; ')}${S.log.length > 3 ? `; +${S.log.length - 3} more` : ''}`;
  let msg = auto.length > 160 ? auto.slice(0, 160).replace(/\s+\S*$/, '') + '…' : auto;
  body.append(field('Commit message', msg, { onInput: (v) => msg = v }));
  body.append(el(`<p class="note">Publishing makes one commit to <b>${esc(cfg.branch)}</b>. GitHub Pages then rebuilds the site, and a change to index.html also triggers your CV workflow.</p>`));
  openSheet('Review and publish', body, [
    btn('Discard all', 'danger', () => { if (confirmDanger('Throw away every unpublished change?')) { S.changes.clear(); S.indexDirty = false; S.rawIndex = null; S.log = []; closeSheet(); reload(); } }),
    btn('Publish now', 'primary', () => publish(msg.trim() || auto)),
  ]);
}
async function publish(message) {
  const steps = [['Check for newer commits', ''], ['Upload changed files', ''], ['Create commit', ''], ['Update the ' + cfg.branch + ' branch', ''], ['Site rebuilds on GitHub Pages', 'Usually under a minute']];
  const ol = el(`<ol class="steps">${steps.map(([t, d], i) => `<li><span class="n">${i + 1}</span><span><b>${esc(t)}</b><small>${esc(d)}</small></span></li>`).join('')}</ol>`);
  openSheet('Publishing', ol, []);
  const li = $$('li', ol);
  const mark = (i, cls, sub) => { li[i].className = cls; if (sub != null) $('small', li[i]).textContent = sub; };
  try {
    mark(0, 'doing');
    const ref = await gh(`/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
    const latest = ref.object.sha;
    const pend = pendingPaths();
    if (latest !== S.head) {
      // Something else committed (often the Scholar/CV bots). Safe only if none of our files changed upstream.
      const cmp = await gh(`/compare/${S.head}...${latest}`);
      const touched = new Set((cmp.files || []).map((f) => f.filename));
      const clash = [...pend.keys()].filter((p) => touched.has(p));
      if (clash.length) throw new Error(`${clash.join(', ')} changed on GitHub since you loaded it. Copy anything you need, then tap reload and redo the edit.`);
      mark(0, 'done', `Built on top of ${latest.slice(0, 7)} (${cmp.ahead_by} newer commit${cmp.ahead_by === 1 ? '' : 's'}, no overlap)`);
    } else mark(0, 'done', 'Up to date');

    mark(1, 'doing');
    const entries = [];
    let k = 0;
    for (const [path, c] of pend) {
      $('small', li[1]).textContent = `${++k} of ${pend.size}: ${path}`;
      if (c.kind === 'delete') { entries.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
      const content = path === 'index.html' ? currentIndex() : c.content;
      const blob = await gh('/git/blobs', { method: 'POST', body: path === 'index.html' || c.kind === 'text' ? { content, encoding: 'utf-8' } : { content, encoding: 'base64' } });
      entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
    }
    mark(1, 'done', `${pend.size} file${pend.size === 1 ? '' : 's'}`);

    mark(2, 'doing');
    const base = await gh(`/git/commits/${latest}`);
    const tree = await gh('/git/trees', { method: 'POST', body: { base_tree: base.tree.sha, tree: entries } });
    const commit = await gh('/git/commits', { method: 'POST', body: { message, tree: tree.sha, parents: [latest] } });
    mark(2, 'done', commit.sha.slice(0, 7));

    mark(3, 'doing');
    await gh(`/git/refs/heads/${encodeURIComponent(cfg.branch)}`, { method: 'PATCH', body: { sha: commit.sha } });
    mark(3, 'done', 'Pushed');

    // reset local state to the new head
    S.log = []; S.changes.clear(); S.indexDirty = false; S.rawIndex = null;
    loadAll().then(render).catch(() => {});

    mark(4, 'doing', 'Waiting for GitHub Pages…');
    $('#sheetFoot').replaceChildren(btn('Done', '', closeSheet), (() => { const a = el(`<a class="btn primary" href="${esc(cfg.site)}" target="_blank" rel="noopener">Open site ${IC.ext}</a>`); return a; })());
    $('#sheetFoot').classList.remove('hidden');
    watchPages(commit.sha, (cls, sub) => mark(4, cls, sub));
  } catch (e) {
    const i = li.findIndex((x) => x.className === 'doing');
    if (i >= 0) mark(i, 'fail', e.message);
    $('#sheetFoot').replaceChildren(btn('Close', '', closeSheet)); $('#sheetFoot').classList.remove('hidden');
    toast('Publish stopped. Nothing was half-written: your edits are still here.', true);
  }
}
async function watchPages(sha, cb) {
  const t0 = Date.now();
  while (Date.now() - t0 < 6 * 60 * 1000) {
    await new Promise((r) => setTimeout(r, 6000));
    try {
      const r = await gh(`/actions/runs?head_sha=${sha}&per_page=20`);
      const pages = r.workflow_runs.find((w) => /pages/i.test(w.name));
      const others = r.workflow_runs.filter((w) => w !== pages).map((w) => `${w.name}: ${w.status === 'completed' ? w.conclusion : w.status}`);
      if (pages) {
        const st = pages.status === 'completed' ? pages.conclusion : pages.status;
        const extra = others.length ? ` · ${others.join(' · ')}` : '';
        if (st === 'success') { cb('done', `Live. ${Math.round((Date.now() - t0) / 1000)} s${extra}`); toast('Your site is live'); return; }
        if (pages.status === 'completed') { cb('fail', `Pages build ${st}. Open Deploy for details.`); return; }
        cb('doing', `Pages: ${st}${extra}`);
      }
    } catch (e) { cb('doing', 'Could not read build status (the token may lack Actions read access). The commit is pushed.'); return; }
  }
  cb('doing', 'Still building. Check the Deploy tab.');
}

}
function openSettings() {
  const { body, save } = settingsForm(false);
  openSheet('Settings', body, [
    btn('Sign out', 'danger', () => { if (confirmDanger('Remove the token from this device?')) { cfg.token = ''; LS.set('cfg', cfg); closeSheet(); boot(); } }),
    btn('Save and connect', 'primary', save),
  ]);
}
function renderWelcome() {
  $('#dock').classList.add('hidden');
  const m = $('#main'); m.innerHTML = '';
  const w = el(`<div class="welcome">
    <div class="sig">Arman</div>
    <h1>Edit your site from your phone.</h1>
    <p>Add news, papers and awards, swap images, edit any file and publish straight to GitHub Pages. Your token stays on this device.</p>
    <ol>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → new fine-grained token</a>.</li>
      <li>Repository access: only <b>${esc(cfg.owner)}/${esc(cfg.repo)}</b>.</li>
      <li>Permissions: <b>Contents</b> read and write, <b>Actions</b> read and write. Pick an expiry you are comfortable with.</li>
      <li>Paste it below.</li>
    </ol>
  </div>`);
  const { body, save } = settingsForm(true);
  w.append(body, btnRow(btn('Connect', 'primary', save)));
  m.append(w);
}

/* ───────── render ───────── */
function render() {
  const m = $('#main'); m.innerHTML = '';
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  const structured = ['news', 'papers', 'honours'].includes(S.tab);
  if (structured && !S.modelOk) {
    m.append(el(`<div class="view-h"><div><h1>Locked</h1><p>index.html no longer contains a readable data block or news array, so this editor is off. Fix it in Files → index.html, or reload to discard.</p></div></div>`));
  } else if (S.tab === 'news') renderNews(m);
  else if (S.tab === 'papers') renderPapers(m);
  else if (S.tab === 'honours') renderHonours(m);
  else if (S.tab === 'files') renderFiles(m);
  else if (S.tab === 'deploy') renderDeploy(m);
  updatePubBar();
}
$$('#tabs button').forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; LS.set('tab', S.tab); render(); window.scrollTo(0, 0); });
$('#pubPill').onclick = reviewPublish;
$('#settingsBtn').onclick = openSettings;
async function reload() {
  if (pendingPaths().size && !confirmDanger('Reloading throws away unpublished changes. Continue?')) return;
  S.changes.clear(); S.indexDirty = false; S.rawIndex = null; S.log = [];
  $('#main').innerHTML = '<div class="loading">Loading from GitHub…</div>';
  try { await loadAll(); $('#dock').classList.remove('hidden'); render(); }
  catch (e) { setStatus('bad', 'Not connected'); $('#main').innerHTML = ''; $('#main').append(el(`<div class="view-h"><div><h1>Couldn't load the site</h1><p>${esc(e.message)}</p></div></div>`), btnRow(btn('Try again', 'primary', reload), btn('Settings', '', openSettings))); }
}
$('#reloadBtn').onclick = () => cfg.token ? reload() : null;

function boot() {
  if (!cfg.token) { setStatus('', 'Not connected'); renderWelcome(); return; }
  reload();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
</script>
</body>
</html>
